# Shared settings for the EDA and the night table.
# Local time is UTC-4 with no daylight saving.
# Night D: the local date of the 18:00 snapshot (22:00 UTC of day D).

frost_threshold_c: 0.0

# Label window: 22:00 UTC of day D to 13:00 UTC of day D+1 (18:00 to 09:00 local), 16 hourly values.
label_window:
  start_hour_utc: 22
  n_hours: 16

# Window used to compare with the AgERA5 night-time minimum (18:00 to 06:00 local),
# 22:00 UTC of day S to 10:00 UTC of day S+1, 13 hourly values.
agera5_night_window:
  start_hour_utc: 22
  n_hours: 13

features:
  snapshot_hour_utc: 22      # 18:00 local
  hour_1500_utc: 19          # 15:00 local
  afternoon_hours_utc: [16, 17, 18, 19, 20, 21]   # 12:00 to 17:00 local
  clearness_doy_halfwidth: 7
  clearness_percentile: 95

# Whole calendar years of the night date D. Never random.
split:
  train: [1985, 2009]
  validation: [2010, 2017]
  test: [2018, 2025]
  out_of_sample_check: [2026, 2026]

# EDA anomaly rules (flags only, nothing is fixed or dropped).
eda:
  dewpoint_tolerance_c: 0.1
  # ssrd is the accumulation over the hour ending at the timestamp. Local night hours whose
  # hour ends between 21:00 and 05:00 local (01:00 to 09:00 UTC) are fully after sunset and
  # before sunrise at these latitudes in every season.
  ssrd_night_hours_utc: [1, 2, 3, 4, 5, 6, 7, 8, 9]
  ssrd_night_max_wm2: 1.0
  strd_range_wm2: [50.0, 550.0]
  sp_max_offset_from_cell_median_hpa: 20.0
  max_hourly_jump:
    t2m_c: 8.0
    d2m_c: 10.0
    skt_c: 15.0
    sp_hpa: 5.0
  stuck_min_run_hours: 6
  stuck_fields: [t2m_c, d2m_c, sp_hpa, skt_c, stl1_c, strd_wm2, u10, v10]
