# CDS datasets downloaded by pipelines/01_download.py.
# The request body is fixed by the dataset form. Only date, area and the output file change.
# Add another dataset as a new key under datasets; the script does not need changes.
datasets:
  era5land_ts:
    dataset_id: reanalysis-era5-land-timeseries
    data_format: netcdf
    variables:
      - 2m_dewpoint_temperature
      - 2m_temperature
      - surface_pressure
      - total_precipitation
      - surface_solar_radiation_downwards
      - surface_thermal_radiation_downwards
      - skin_temperature
      - soil_temperature_level_1
      - 10m_u_component_of_wind
      - 10m_v_component_of_wind
    out_dir: data/raw/cds/era5land_ts
    # Cell tests. corner and center are kept for reference only: they return one cell
    # other than the target and four cells, so they now fail the one-cell assertion.
    # corner: [-16.4, -68.2, -16.5, -68.1] returned (-16.5, -68.1).
    # center: [-16.4, -68.3, -16.6, -68.1] returned lat -16.5, -16.6 and lon -68.2, -68.1.
    tests:
      corner:
        point: el_alto
        date: 2025-07-01/2025-07-31
        area: [-16.4, -68.2, -16.5, -68.1]
        file: test_elalto_2025-07.nc
      center:
        point: el_alto
        date: 2025-07-01/2025-07-31
        area: [-16.4, -68.3, -16.6, -68.1]
        file: test_elalto_2025-07_center.nc
      node_se:
        point: el_alto
        date: 2025-07-01/2025-07-31
        area: [-16.4, -68.3, -16.5, -68.2]
        file: test_elalto_2025-07_node_se.nc
    ranges:
      - name: main
        date: 1985-01-01/2025-12-31
        file: "{id}_1985-2025.nc"
        use: train_val_test
      # Never used for training, validation or test; usable for the replay and the manual tick.
      - name: 2026_ytd
        date: 2026-01-01/2026-10-26
        file: "{id}_2026_ytd.nc"
        use: out_of_sample_check

  # AgERA5 daily agrometeorological indicators. A different product from ERA5-Land with
  # its own 0.1 degree grid, possibly offset from the ERA5-Land cell by up to about 7 km.
  # One request per point with a single location (the real city coordinates from
  # configs/points.yaml); the service snaps to the nearest grid point, which must lie
  # within max_offset_deg of the requested coordinates in latitude and longitude.
  agera5_ts:
    dataset_id: sis-agrometeorological-indicators-timeseries
    data_format: netcdf
    selection: location
    time_step: daily
    max_offset_deg: 0.06
    variables:
      - 2m_temperature_night_time_minimum
      - 2m_relative_humidity_at_15_00
      - cloud_cover_24_hour_mean
    # How each variable may be used downstream.
    roles:
      # 24 hour mean over the whole local day: for the night of day D only day D-1 is used.
      cloud_cover_24_hour_mean: {role: feature, lag_days: 1}
      # Only to cross-check the frost label in the EDA. Never a model feature.
      2m_temperature_night_time_minimum: {role: eda_label_check_only}
      2m_relative_humidity_at_15_00: {role: crosscheck}
    out_dir: data/raw/cds/agera5_ts
    tests:
      agera5:
        point: el_alto
        date: 2025-07-01/2025-07-31
        file: test_elalto_2025-07.nc
    ranges:
      # Rows dated 2026 never enter training, validation or test; the split step filters by date.
      - name: main
        date: 1984-12-31/2026-10-25
        file: "{id}_1984-2026.nc"
        use: train_val_test_until_2025_then_out_of_sample_check
