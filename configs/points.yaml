# Download points in priority order.
# area_mode node_se: for a target grid node (lat0, lon0) the request box [N, W, S, E] is
# [lat0 + 0.1, lon0 - 0.1, lat0, lon0]. CDS appears to return cells with S <= lat < N and
# W < lon <= E, so this box should return exactly one cell: the target node.
# lat/lon are the target coordinates; cell is the expected ERA5-Land grid node.
area_mode: node_se
points:
  - id: el_alto
    lat: -16.51
    lon: -68.19
    cell: [-16.5, -68.2]
    area: [-16.4, -68.3, -16.5, -68.2]
