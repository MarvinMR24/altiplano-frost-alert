# FrostWatch Altiplano: three modules (ml, backend, mobile) plus an ngrok tunnel.
# No secrets in this file. Values come from .env through ${VAR} substitution, and each
# service gets only the variables it needs.
#
#   docker compose up                              -> backend + ngrok
#   docker compose --profile mobile up mobile      -> Expo dev server (best effort on macOS)
#   docker compose run --rm ml python pipelines/... -> ml, on demand only (never via `up`)
#
# Never run `docker compose config` without --quiet: it prints interpolated secrets.

services:
  backend:
    build: ./backend
    environment:
      META_API_KEY: ${META_API_KEY:-}
      META_API_BASE_URL: ${META_API_BASE_URL:-}
      MUSE_MODEL: ${MUSE_MODEL:-}
      MUSE_MOCK: ${MUSE_MOCK:-1}
      SESSION_SECRET: ${SESSION_SECRET:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER:-}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      DATABASE_URL: sqlite:////app/var/frostwatch.db
      DATA_PROVIDER: ${DATA_PROVIDER:-mock}
      # CDS_API_KEY is intentionally NOT passed to the backend.
    volumes:
      - ./artifacts:/app/artifacts:ro
      - backend_var:/app/var
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ngrok:
    image: ngrok/ngrok:latest
    # --url replaces the deprecated --domain flag of the ngrok agent.
    command: ["http", "backend:8000", "--url=${NGROK_DOMAIN:-}"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    depends_on:
      backend:
        condition: service_healthy

  mobile:
    profiles: ["mobile"]
    build: ./mobile
    environment:
      REACT_NATIVE_PACKAGER_HOSTNAME: ${HOST_LAN_IP:-}
      EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-}
      EXPO_PUBLIC_USE_MOCK: ${EXPO_PUBLIC_USE_MOCK:-1}
    ports:
      - "8081:8081"
    volumes:
      - ./mobile:/app
      - /app/node_modules
    stdin_open: true
    tty: true

  # ml: on demand only, `docker compose run --rm ml python pipelines/<script>.py ...`
  # NEVER run the CDS download through `up`, never in parallel, and never while another CDS
  # process holds the lock (data/raw/cds/.lock). One CDS process only (MUSE.md rule 29).
  ml:
    profiles: ["ml"]
    build:
      context: .
      dockerfile: ml/Dockerfile
    restart: "no"
    working_dir: /work
    environment:
      CDS_API_KEY: ${CDS_API_KEY:-}
      CDS_API_URL: ${CDS_API_URL:-}
      META_API_KEY: ${META_API_KEY:-}
      META_API_BASE_URL: ${META_API_BASE_URL:-}
      MUSE_MODEL: ${MUSE_MODEL:-}
    volumes:
      - ./pipelines:/work/pipelines
      - ./configs:/work/configs
      - ./prompts:/work/prompts
      - ./experiments:/work/experiments
      - ./data:/work/data
      - ./logs:/work/logs
      - ./artifacts:/work/artifacts
      - ./docs:/work/docs

volumes:
  backend_var:
