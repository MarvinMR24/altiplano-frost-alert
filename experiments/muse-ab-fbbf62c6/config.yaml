anomaly_review:
  sample_cap: 300
  batch_size: 20
  neighbor_hours: 3
  confidence_min: 0.8
  sample_splits:
  - train
  - validation
  clip_tiny_negatives:
    tp_mm: 0.001
    ssrd_wm2: 0.01
  ranges_c:
    t2m_c:
    - -40.0
    - 45.0
    d2m_c:
    - -60.0
    - 35.0
    skt_c:
    - -50.0
    - 70.0
  units:
    t2m_c: degC
    d2m_c: degC
    skt_c: degC
  names:
    t2m_c: air temperature at 2 m
    d2m_c: dew point temperature at 2 m
    skt_c: skin (surface) temperature
feature_proposals:
  max_features: 6
  exclude:
  - latitude
  - elevation_proxy_m
  functions:
  - min
  - max
  - abs
  - log1p
  - sqrt
decision_rule:
  min_gain_pr_auc: 0.02
  min_gain_f2: 0.02
  reference_run: r2-LR_best-fbbf62c6
  reference_model_version: lr-20261103-fbbf62c6
model_params:
  C: 1.0
  class_weight: null
  penalty: l1
