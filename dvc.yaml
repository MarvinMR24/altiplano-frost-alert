# Data pipeline. Run from the project root with the .venv created from requirements*.txt.
# Raw inputs are tracked by dvc/raw_cds.dvc. Docs and figures are small text or images kept
# in git (cache: false); data outputs live in the DVC cache and the DagsHub remote.
stages:
  02a_eda_era5land:
    cmd: .venv/bin/python pipelines/02a_eda_era5land.py --no-sync
    deps:
      - pipelines/02a_eda_era5land.py
      - src/frostwatch_ml
      - configs/frost.yaml
      - configs/points.yaml
      - data/raw/cds
    outs:
      - data/processed/anomalies.parquet
      - data/processed/eda_era5land
      - docs/eda_era5land.md:
          cache: false
      - docs/figures/era5land_frost_rate_by_month.png:
          cache: false
      - docs/figures/era5land_frost_nights_by_year.png:
          cache: false

  02b_eda_agera5:
    cmd: .venv/bin/python pipelines/02b_eda_agera5.py --no-sync
    deps:
      - pipelines/02b_eda_agera5.py
      - src/frostwatch_ml
      - configs/frost.yaml
      - configs/points.yaml
      - data/raw/cds
    outs:
      - data/processed/eda_agera5
      - docs/eda_agera5.md:
          cache: false
      - docs/figures/agera5_cloud_cover_by_month.png:
          cache: false
      - docs/figures/agera5_vs_era5land_tmin_el_alto.png:
          cache: false

  03_build_night_table:
    cmd: .venv/bin/python pipelines/03_build_night_table.py --no-sync
    deps:
      - pipelines/03_build_night_table.py
      - src/frostwatch_ml
      - configs/frost.yaml
      - configs/features.yaml
      - configs/points.yaml
      - data/raw/cds
    outs:
      - data/processed/features.parquet
      - data/processed/crosschecks.parquet
      - data/processed/features_manifest.json
      - data/processed/fitted_stats.json

  03b_eda_merged:
    cmd: .venv/bin/python pipelines/03b_eda_merged.py --no-sync
    deps:
      - pipelines/03b_eda_merged.py
      - src/frostwatch_ml
      - data/processed/features.parquet
      - data/processed/crosschecks.parquet
      - data/processed/features_manifest.json
    outs:
      - data/processed/eda_merged
      - docs/eda_merged.md:
          cache: false
      - docs/figures/merged_frost_rate_by_year.png:
          cache: false
      - docs/figures/merged_corr_with_label_train.png:
          cache: false

  round1:
    cmd: .venv/bin/python pipelines/04_round1.py --no-sync
    deps:
      - pipelines/04_round1.py
      - src/frostwatch_ml
      - configs/model.yaml
      - configs/features.yaml
      - data/processed/features.parquet
      - data/processed/features_manifest.json
    outs:
      - data/processed/predictions/r1
      - reports/round1:
          cache: false
      - docs/model_round1.md:
          cache: false

  round2:
    cmd: .venv/bin/python pipelines/05_round2.py --no-sync
    deps:
      - pipelines/05_round2.py
      - src/frostwatch_ml
      - configs/model.yaml
      - configs/features.yaml
      - data/processed/features.parquet
      - data/processed/features_manifest.json
      - reports/round1/comparison_pooled.csv
    outs:
      - models
      - data/processed/model_candidates.json
      - data/processed/predictions/r2
      - reports/round2:
          cache: false
      - docs/model_round2.md:
          cache: false

  export:
    cmd: .venv/bin/python pipelines/05b_export_artifacts.py --no-sync
    deps:
      - pipelines/05b_export_artifacts.py
      - src/frostwatch_ml
      - configs/model.yaml
      - configs/features.yaml
      - data/processed/features.parquet
      - data/processed/features_manifest.json
      - models
      - data/processed/model_candidates.json
    outs:
      - reports/lr-20261103-fbbf62c6:
          cache: false
      - reports/lightgbm-20261103-fbbf62c6:
          cache: false
      - reports/README.md:
          cache: false

  muse_correct:
    # Muse calls are read from logs/muse_cache/ (gitignored). Without the cache this stage calls the
    # Meta Model API (MUSE_MOCK=0) or uses deterministic fakes (MUSE_MOCK=1, the default).
    cmd: .venv/bin/python pipelines/05_muse_correct.py --config configs/muse.yaml --no-sync
    deps:
      - pipelines/05_muse_correct.py
      - src/frostwatch_ml
      - configs/muse.yaml
      - configs/frost.yaml
      - configs/features.yaml
      - configs/model.yaml
      - prompts/muse_anomaly_review_v1.txt
      - prompts/muse_feature_proposals_v1.txt
      - data/raw/cds
      - data/processed/features.parquet
      - data/processed/features_manifest.json
      - data/processed/anomalies.parquet
      - data/processed/model_candidates.json
    outs:
      - data/processed/muse
      - data/processed/predictions/muse
      - reports/muse_experiment.md:
          cache: false
